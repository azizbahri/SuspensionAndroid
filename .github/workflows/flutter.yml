name: Flutter CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend_flutter/**'
      - '.github/workflows/flutter.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend_flutter/**'
      - '.github/workflows/flutter.yml'

jobs:
  analyze_and_test:
    name: analyze + test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          cd frontend_flutter
          flutter pub get

      - name: Dart analysis
        run: |
          cd frontend_flutter
          flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Unit tests
        run: |
          cd frontend_flutter
          flutter test test/unit/ --reporter=expanded
